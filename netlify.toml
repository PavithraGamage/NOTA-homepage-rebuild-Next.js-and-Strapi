# Netlify builds and serves the website (apps/web). Strapi runs on Render (render.yaml), and the
# database and uploads are on Neon. Variables are set in Netlify's UI: see apps/web/.env.example
# and docs/hosting.md.

[build]
  base = "apps/web"
  publish = ".next"
  # The CMS sleeps when idle on Render's free plan and takes up to a minute to wake. Waking it in
  # the background during the build means it is up when the new deploy gets its first visit.
  command = "sh scripts/wake-cms.sh & npm run build"
  # Skip the build when a commit changes nothing the website uses (e.g. CMS-only or docs-only).
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- . ../../netlify.toml"

[build.environment]
  NODE_VERSION = "24"
  NEXT_TELEMETRY_DISABLED = "1"

# Netlify's Next.js runtime (OpenNext adapter): turns .next into server functions and static assets.
# Netlify normally adds it on its own, but didn't for this monorepo (the app is in apps/web), so it's
# declared here and pinned in apps/web/package.json. Without it, .next is uploaded as plain files
# and every route returns 404.
[[plugins]]
  package = "@netlify/plugin-nextjs"
