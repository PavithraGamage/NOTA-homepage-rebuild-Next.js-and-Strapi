# Local development database only. In production Railway provides Postgres
# on its private network; the apps themselves run with `npm run dev` / `npm run develop`.
services:
  postgres:
    # Same major version as Railway's Postgres template (postgres-ssl:18).
    image: postgres:18-alpine
    container_name: nota-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: strapi
      POSTGRES_PASSWORD: strapi
      POSTGRES_DB: nota_cms
    ports:
      - "5432:5432"
    volumes:
      # Postgres 18 images keep data in a versioned subfolder of /var/lib/postgresql.
      - nota-pgdata-18:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U strapi -d nota_cms"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  nota-pgdata-18:
